<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <!-- CosBioSys: turquoise globe with network nodes -->
  <defs>
    <radialGradient id="g" cx="35%" cy="30%" r="75%">
      <stop offset="0%" stop-color="#5ec8c2"/>
      <stop offset="100%" stop-color="#1a6b70"/>
    </radialGradient>
  </defs>
  <circle cx="16" cy="16" r="15" fill="url(#g)"/>
  <!-- Meridians -->
  <ellipse cx="16" cy="16" rx="5"  ry="14" fill="none" stroke="#b5ede8" stroke-width="0.4" opacity="0.55"/>
  <ellipse cx="16" cy="16" rx="10" ry="14" fill="none" stroke="#b5ede8" stroke-width="0.4" opacity="0.45"/>
  <!-- Latitudes -->
  <ellipse cx="16" cy="16" rx="14" ry="4"  fill="none" stroke="#b5ede8" stroke-width="0.4" opacity="0.5"/>
  <ellipse cx="16" cy="16" rx="14" ry="9"  fill="none" stroke="#b5ede8" stroke-width="0.4" opacity="0.4"/>
  <!-- Network nodes -->
  <circle cx="11"   cy="10.5" r="1.1" fill="#f5d88a"/>
  <circle cx="20"   cy="12"   r="1.1" fill="#f5d88a"/>
  <circle cx="22.5" cy="19"   r="1.1" fill="#f5d88a"/>
  <circle cx="12.5" cy="22"   r="1.1" fill="#f5d88a"/>
  <circle cx="17"   cy="17.5" r="1.3" fill="#fff2c0"/>
  <!-- Connecting threads -->
  <path d="M11 10.5 L17 17.5 L20 12 M17 17.5 L22.5 19 M17 17.5 L12.5 22"
        stroke="#fff2c0" stroke-width="0.4" fill="none" opacity="0.6"/>
</svg>
